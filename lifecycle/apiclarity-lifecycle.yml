description: >-
  Lifecycle posture for APIClarity. The headline fact is that the project has ended: GitHub
  records the repository as "archived by the owner on May 29, 2026. It is now read-only", the
  wider OpenClarity organisation was archived days later, and both project web properties
  (openclarity.io and apiclarity.io) now return 404 on every path. The last software release
  was v0.14.5 on 2023-05-05 — three years before the archive.
status: end-of-life
