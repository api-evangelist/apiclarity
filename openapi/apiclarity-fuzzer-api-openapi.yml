components:
  schemas:
    TestInput:
      type: object
      description: contains all input parameters for a test
      properties:
        auth:
          $ref: '#/components/schemas/AuthorizationScheme'
        depth:
          $ref: '#/components/schemas/TestInputDepthEnum'
      required:
      - depth
    BasicAuth:
      allOf:
      - $ref: '#/components/schemas/AuthorizationSchemeBase'
      - type: object
        properties:
          username:
            type: string
          password:
            type: string
        required:
        - username
        - password
    ApiToken:
      allOf:
      - $ref: '#/components/schemas/AuthorizationSchemeBase'
      - type: object
        properties:
          key:
            type: string
          value:
            type: string
        required:
        - key
        - value
    FuzzingStatusEnum:
      description: An enumeration.
      enum:
      - DONE
      - ERROR
      - IN_PROGRESS
      title: FuzzingStatus
      type: string
    FuzzingReportOperation:
      description: Report tag operation
      title: Report tag operation
      type: object
      properties:
        operation:
          $ref: ../../../../../../api3/common/openapi.yaml#/components/schemas/MethodAndPath
        requestsCount:
          title: Request count to the opea
          description: Request count to this operation item during the test
          type: integer
          format: int32
        findings:
          title: Findings list
          type: array
          items:
            $ref: ../../../../../../api3/common/openapi.yaml#/components/schemas/APIFinding
        highestSeverity:
          $ref: ../../../../../../api3/common/openapi.yaml#/components/schemas/Severity
      required:
      - operation
      - requestsCount
    ShortTestProgress:
      title: Short Test Progress Report
      description: Describes the progress of an ongoing test
      type: object
      properties:
        apiID:
          $ref: ../../../../../../api3/common/openapi.yaml#/components/schemas/ApiID
        starttime:
          description: Timestamp of the start of the test
          title: Start time
          type: integer
          format: int64
        progress:
          description: Progress of the test
          maximum: 100.0
          minimum: 0.0
          title: Description
          type: integer
      required:
      - starttime
      - progress
    AuthorizationScheme:
      oneOf:
      - $ref: '#/components/schemas/BasicAuth'
      - $ref: '#/components/schemas/ApiToken'
      - $ref: '#/components/schemas/BearerToken'
      discriminator:
        propertyName: type
        mapping:
          BasicAuth: '#/components/schemas/BasicAuth'
          ApiToken: '#/components/schemas/ApiToken'
          BearerToken: '#/components/schemas/BearerToken'
    ShortTestReport:
      title: Short Test Report
      description: Short Test Report
      type: object
      properties:
        apiID:
          $ref: ../../../../../../api3/common/openapi.yaml#/components/schemas/ApiID
        starttime:
          description: Timestamp of the start of the test
          title: Start time
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/FuzzingStatusEnum'
        statusMessage:
          title: Status message details
          description: Message for status details, if any
          type: string
        tags:
          title: Tags list
          type: array
          items:
            $ref: '#/components/schemas/FuzzingReportTag'
        highestSeverity:
          $ref: ../../../../../../api3/common/openapi.yaml#/components/schemas/Severity
      required:
      - starttime
      - status
    BearerToken:
      allOf:
      - $ref: '#/components/schemas/AuthorizationSchemeBase'
      - type: object
        properties:
          token:
            type: string
        required:
        - token
    FuzzingReportTag:
      title: Report tag item
      description: Report tag item
      type: object
      properties:
        name:
          title: Tag name
          description: Tag name
          type: string
        operations:
          title: Operations list
          type: array
          items:
            $ref: '#/components/schemas/FuzzingReportOperation'
        highestSeverity:
          $ref: ../../../../../../api3/common/openapi.yaml#/components/schemas/Severity
      required:
      - name
      - operations
    AuthorizationSchemeBase:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AuthorizationTypeEnum'
      required:
      - type
    AuthorizationTypeEnum:
      description: An enumeration for the authorization type parameter.
      enum:
      - BASICAUTH
      - APITOKEN
      - BEARERTOKEN
      title: AuthorizationType
      type: string
    TestInputDepthEnum:
      description: An enumeration for input depth parameter.
      enum:
      - QUICK
      - DEFAULT
      - DEEP
      title: TestInputDepth
      type: string
    TestHandle:
      type: object
      properties:
        apiID:
          $ref: ../../../../../../api3/common/openapi.yaml#/components/schemas/ApiID
        timestamp:
          type: integer
          format: int64
    FuzzingReportOperation_2:
      description: Report tag operation
      properties:
        findings:
          items:
            $ref: ../common/openapi.yaml#/components/schemas/APIFinding
          title: Findings list
          type: array
        highestSeverity:
          $ref: ../common/openapi.yaml#/components/schemas/Severity
        operation:
