      operationId: getVersion
      summary: Get the version of this Module
      tags:
      - local-bfla
      responses:
        '200':
          description: Version of the Module
          content:
            application/json:
              schema:
                $ref: ../../../../../../api3/common/openapi.yaml#/components/schemas/ModuleVersion
  /authorizationModel/{apiID}/approve:
    put:
      tags:
      - local-bfla
      parameters:
      - name: apiID
        in: path
        required: true
        schema:
          $ref: ../../../../../../api3/common/openapi.yaml#/components/schemas/ApiID
      - in: query
        name: method
        required: true
        schema:
          type: string
      - in: query
        name: path
        required: true
        schema:
          type: string
      - in: query
        name: k8sClientUid
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: ../../../../../../api3/common/openapi.yaml#/components/schemas/ApiResponse
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: ../../../../../../api3/common/openapi.yaml#/components/schemas/ApiResponse
      summary: Replace authorization model by api id approve
      x-summary-source: derived
      operationId: putAuthorizationModelByApiIDApprove
      x-operation-id-source: derived
  /authorizationModel/{apiID}/deny:
    put:
      tags:
      - local-bfla
      parameters:
