openapi: 3.2.0
info:
  title: Apiclarity Local Bfla API
  version: '1.0'
  description: 'Operations tagged local-bfla across 2 of this provider''s published API definitions: apiclarity-bfla-module-openapi.yml, apiclarity-global-openapi.gen.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api
tags:
- name: local-bfla
paths:
