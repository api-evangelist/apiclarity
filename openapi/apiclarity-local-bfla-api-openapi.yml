      x-summary-source: derived
      operationId: putAuthorizationModelByApiIDDeny
      x-operation-id-source: derived
  /event/{id}:
    get:
      tags:
      - local-bfla
      operationId: get_event
      parameters:
      - name: id
        in: path
        schema:
          type: integer
        required: true
      summary: Get the event with the annotations and bfla status
      responses:
        '200':
          description: API Event with annotations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIEventAnnotations'
  /event/{id}/{operation}:
    put:
      tags:
      - local-bfla
      parameters:
      - in: path
        schema:
          type: integer
        required: true
        name: id
      - in: path
        required: true
        name: operation
        schema:
          $ref: '#/components/schemas/OperationEnum'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: ../../../../../../api3/common/openapi.yaml#/components/schemas/ApiResponse
