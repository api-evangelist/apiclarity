      summary: Replace modules bfla authorization model by api id deny
      x-summary-source: derived
      operationId: putModulesBflaAuthorizationModelByApiIDDeny
      x-operation-id-source: derived
    servers:
    - url: /api
  /modules/bfla/event/{id}:
    get:
      operationId: bflaget_event
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIEventAnnotations'
          description: API Event with annotations
