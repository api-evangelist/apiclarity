      tags:
      - local-bfla
    servers:
    - url: /api
  /modules/bfla/event/{id}/{operation}:
    put:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      - in: path
        name: operation
        required: true
        schema:
          $ref: '#/components/schemas/OperationEnum'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ../common/openapi.yaml#/components/schemas/ApiResponse
          description: Success
