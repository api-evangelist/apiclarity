components:
  schemas:
    DetectedUser:
      required:
      - id
      - source
      - ip_address
      properties:
        id:
          type: string
        source:
          type: string
          enum:
          - JWT
          - BASIC
          - KONG_X_CONSUMER_ID
        ip_address:
          type: string
    APIEventAnnotations:
      required:
      - bflaStatus
      - external
      - mismatchedScopes
      properties:
        external:
          type: boolean
        mismatchedScopes:
          type: boolean
        destinationK8sObject:
          $ref: '#/components/schemas/K8sObjectRef'
        sourceK8sObject:
          $ref: '#/components/schemas/K8sObjectRef'
        bflaStatus:
          $ref: '#/components/schemas/BFLAStatus'
        detectedUser:
          $ref: '#/components/schemas/DetectedUser'
    K8sObjectRef:
      type: object
      required:
      - uid
      - kind
      - name
      - namespace
      - apiVersion
      properties:
        uid:
          type: string
        kind:
          type: string
        name:
          type: string
        namespace:
          type: string
        apiVersion:
          type: string
    OperationEnum:
      type: string
      enum:
      - approve
      - deny
      - approve_user
      - deny_user
    BFLAStatus:
      type: string
      enum:
      - NO_SPEC
      - LEARNING
      - LEGITIMATE
      - SUSPICIOUS_MEDIUM
      - SUSPICIOUS_HIGH
