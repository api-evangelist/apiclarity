base_url_decision:
  date: '2026-09-04'
  verdict: templated
  value_used: https://apiclarity-server/api (and /api/modules/{module} per module)
  rationale: >-
    APIClarity's published specs declare a relative server (`servers: [{url: /api}]`), and
    repair-api-bases.py reports every candidate as non-routable (http://localhost:8080/api). There
    is no vendor host to substitute and none was invented. The host token `apiclarity-server` is
    the project's OWN placeholder, written in api3/README.md: "if API Clarity Core API is served
    under https://apiclarity-server/api/ then the module 'example' will have its APIs exposed
    under https://apiclarity-server/api/modules/example/".
  evidence:
    url: https://raw.githubusercontent.com/openclarity/apiclarity/master/api3/README.md
    status: 200
  not_applied_to: >-
    apiclarity:apiclarity-notifications-api — that contract is inverted; the base belongs to the
    operator's own listener, not to APIClarity. Left absent deliberately.
  servers_blocks_untouched: true
derived_document_corrections:
  note: >-
    openapi/apiclarity-*-openapi.yml for the API Events, API Inventory, Control and Features
    entries are API Evangelist-derived documents (a tag-split of a converted legacy Swagger 2.0),
    not verbatim provider files. Two defects in them were corrected on 2026-09-04.
  corrections:
  - date: '2026-09-04'
    defect: fabricated securityScheme
    detail: >-
      All four documents, and openapi/_original/apiclarity-openapi.yml, defined a `BearerAuth`
      http/bearer securityScheme described as "APIClarity is typically deployed inside a
      Kubernetes cluster behind an ingress that enforces authentication. When exposed externally,
      deployments commonly require a bearer token." No APIClarity contract declares any
      securityScheme — api/swagger.yaml, api3/core/openapi.yaml, api3/global/openapi.gen.yaml and
      all five module specs declare zero. The scheme was written by an earlier round, was never
      applied by any `security:` block, and was then read back out into
      authentication/apiclarity-authentication.yml as though it were the provider's. Removed from
      all five documents and from the authentication profile.
  - date: '2026-09-04'
    defect: dangling $ref
    detail: >-
      Four operations across the Control and API Inventory documents referenced
      `#/responses/Success` as a schema — a Swagger-2.0-to-OpenAPI-3 conversion artifact,
      already flagged as an error in openapi/.refine-report.json. Repointed at a
      `#/components/schemas/SuccessResponse` object carrying the upstream description and its
      single `message` string, matching definitions.SuccessResponse in api/swagger.yaml. All
      eleven documents in openapi/ now resolve every internal $ref.
