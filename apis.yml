aid: apiclarity
name: APIClarity
description: >-
  APIClarity is an open source (Apache-2.0) API security and observability tool that captures
  API traffic in a Kubernetes environment, reconstructs OpenAPI specifications from what it
  observes, and detects shadow APIs, zombie APIs, specification drift and broken function-level
  authorization. It integrates with Istio, Kong, Tyk, Kuma, a tap DaemonSet and an
  OpenTelemetry Collector as traffic sources, and ships as a Helm chart you deploy into your own
  cluster — there is no hosted service, no vendor account and no vendor API host. It was part of
  the OpenClarity project. APIClarity has reached end of life: the source repository was archived
  read-only by its owner on 2026-05-29, the last release was v0.14.5 on 2023-05-05, and both
  project websites (openclarity.io and apiclarity.io) now return HTTP 404. The source, the eleven
  published specifications, the Helm chart repository and the container images all remain
  publicly readable, which is what this profile is built from.
