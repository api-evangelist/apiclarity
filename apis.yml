  name: APIClarity Plugins Telemetry API
  description: >-
    The Swagger 2.0 contract every APIClarity traffic-source plugin implements to push captured
    traffic into a deployment — POST /telemetry, GET /hostsToTrace and
    POST /control/newDiscoveredAPIs. Authenticated with the optional X-Trace-Source-Token header
